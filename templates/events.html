<h2>External Campus Events</h2>

<ul>
    {% for event in external_events %}

    <li>
        <strong>{{ event.event_name }}</strong>

        <p>Date: {{ event.event_date }}</p>

        <p>Time: {{ event.event_time }}</p>

        <p>Location: {{ event.event_location }}</p>

        <p>{{ event.description }}</p>
    </li>

    {% endfor %}
</ul>
