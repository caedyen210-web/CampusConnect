<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CampusConnect Weather</title>
</head>

<body>

    <h1>CampusConnect Weather</h1>

    <table border="1">

        <tr>
            <th>City</th>
            <th>Temperature (°F)</th>
            <th>Weather Description</th>
            <th>Humidity (%)</th>
            <th>Wind Speed (mph)</th>
        </tr>

        {% for weather in api_data %}
        <tr>
            <td>{{ weather.city }}</td>
            <td>{{ weather.temperature }}</td>
            <td>{{ weather.weather_description }}</td>
            <td>{{ weather.humidity }}</td>
            <td>{{ weather.wind_speed }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
