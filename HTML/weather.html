
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Weather</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                CampusConnect
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="{{ url_for('index') }}">Home</a>
                    <a class="nav-link" href="{{ url_for('event_routes.events') }}">Events</a>
                    <a class="nav-link active" href="{{ url_for('api_routes.api') }}">Weather</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container py-5">

        <div class="text-center mb-5">
            <h1>Campus Weather</h1>
            <p class="lead">
                Check the current weather conditions near campus.
            </p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card weather-card">
                    <div class="card-body text-center">

                        <h2>Current Weather</h2>

                        <h1 id="temperature" class="display-3">
                            Loading...
                        </h1>

                        <p id="description">
                            Getting weather information...
                        </p>

                        <hr>

                        <div class="row">

                            <div class="col-6 mb-3">
                                <h5>Feels Like</h5>
                                <p id="feelsLike">--</p>
                            </div>

                            <div class="col-6 mb-3">
                                <h5>Humidity</h5>
                                <p id="humidity">--</p>
                            </div>

                            <div class="col-6">
                                <h5>Wind Speed</h5>
                                <p id="windSpeed">--</p>
                            </div>

                            <div class="col-6">
                                <h5>Location</h5>
                                <p>Adrian, Michigan</p>
                            </div>

                        </div>

                        <p id="weatherError" class="text-danger"></p>

                        <button id="refreshWeather" class="btn btn-primary">
                            Refresh Weather
                        </button>

                    </div>
                </div>

            </div>
            
        </div>

        <div class="text-center mt-5">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                Back to Home
            </a>

            <a href="{{ url_for('event_routes.events') }}" class="btn btn-primary">
                View Events
            </a>

        </div>

    </main>

    <footer class="text-center py-4">
        <p>CampusConnect &copy; 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
